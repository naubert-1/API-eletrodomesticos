spring.application.name=config-service
server.port=8888

#spring.profiles.active=native

#spring.cloud.config.server.native.search-locations=classpath:/configs/{application}

spring.cloud.config.server.git.uri=https://github.com/luciano-ferretto/ParadLingProg_202601.git
spring.cloud.config.server.git.default-label=main
spring.cloud.config.server.git.search-paths=/microservices/configs/{application}


eureka.client.service-url.default-zone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

eureka.client.healthcheck.enabled=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.description=Microservice Java 2026
info.app.autor=Naubert Piva Migliavacca

eureka.instance.metadata-map.github.repo=naubert-1/API-eletrodomesticos

management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true